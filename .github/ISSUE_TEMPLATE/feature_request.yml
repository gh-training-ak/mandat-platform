name: Feature request
description: Suggest something new.
title: "[Feature]: "
labels: [ "enhancement", "needs-triage" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?

  - type: dropdown
    id: value
    attributes:
      label: Who benefits?
      options: [ Students, Mentors, Administrators, The team maintaining it ]
    validations:
      required: true
